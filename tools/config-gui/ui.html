<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>博客静态配置</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #fff;
        --fg: #24292f;
        --dim: #6b7280;
        --line: #e5e7eb;
        --accent: #2563eb;
        --warn: #b45309;
        --ok: #15803d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      }
      header {
        position: sticky; top: 0; z-index: 10;
        background: var(--card); border-bottom: 1px solid var(--line);
        padding: 12px 20px; display: flex; align-items: center; gap: 12px;
      }
      header h1 { font-size: 16px; margin: 0; flex: 1; }
      button {
        font: inherit; padding: 7px 14px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--line); background: #fff;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      main { max-width: 980px; margin: 0 auto; padding: 20px; }
      section {
        background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        margin-bottom: 16px; overflow: hidden;
      }
      section > h2 {
        font-size: 14px; margin: 0; padding: 11px 16px;
        background: #fafbfc; border-bottom: 1px solid var(--line);
      }
      .field {
        display: grid; grid-template-columns: 240px 1fr; gap: 10px;
        padding: 10px 16px; border-bottom: 1px solid #f1f2f4; align-items: start;
      }
      .field:last-child { border-bottom: 0; }
      .field > label { color: var(--fg); padding-top: 5px; }
      .field .path { display: block; color: var(--dim); font-size: 11px; font-family: ui-monospace, monospace; }
      .field .hint { display: block; color: var(--warn); font-size: 11.5px; margin-top: 3px; }
      .field .ctrl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      input[type="text"], input[type="number"], textarea, select {
        font: inherit; padding: 6px 9px; border: 1px solid var(--line);
        border-radius: 6px; background: #fff; color: var(--fg); width: 100%; max-width: 560px;
      }
      textarea { font-family: ui-monospace, monospace; font-size: 12.5px; min-height: 68px; resize: vertical; }
      input[type="number"] { max-width: 140px; }
      input[type="color"] { width: 38px; height: 32px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
      .override { font-size: 11px; color: var(--accent); }
      .btn-reset { font-size: 11px; padding: 2px 7px; }
      .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
      .thumb {
        position: relative; display: block; cursor: pointer; width: 118px;
        border: 2px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff;
      }
      .thumb.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
      .thumb input { position: absolute; opacity: 0; pointer-events: none; }
      .thumb img { display: block; width: 100%; height: 74px; object-fit: cover; background: #f2f3f5; }
      .thumb span { display: block; font-size: 10.5px; color: var(--dim); padding: 3px 5px; word-break: break-all; }
      .font-preview {
        margin-top: 6px; padding: 8px 12px; border: 1px dashed var(--line);
        border-radius: 6px; background: #fafbfc;
      }
      /* 列表编辑器：原来要手写 JSON 的地方，全部改成一行行填 */
      .list { width: 100%; max-width: 660px; }
      .list-row, .order-row {
        border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
        margin-bottom: 8px; background: #fcfcfd;
      }
      .order-row { display: flex; align-items: center; gap: 6px; padding: 5px 10px; margin-bottom: 5px; }
      .list-row.miss { border-color: var(--warn); background: #fffbeb; }
      .list-head { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
      .list-index {
        flex: 0 0 22px; text-align: center; font-size: 11px; color: var(--dim);
        background: #eef1f4; border-radius: 999px; padding: 1px 0;
      }
      .list-title { flex: 1; font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .order-row .name { flex: 1; font-size: 12.5px; }
      .list-head button, .order-row button, .list-tools button { font-size: 11px; padding: 1px 8px; line-height: 1.6; }
      .list-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
      .list-fields label { display: block; font-size: 11.5px; color: var(--dim); }
      .list-fields label span { display: block; margin-bottom: 2px; }
      .list-fields label.wide { grid-column: 1 / -1; }
      .list-fields input, .list-fields textarea { max-width: none; padding: 4px 8px; font-size: 12.5px; }
      .list-fields textarea { min-height: 50px; font-family: inherit; }
      .list-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .list-note { font-size: 11.5px; color: var(--warn); }
      .list.nested { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--line); }
      .list.nested.off { opacity: 0.45; }
      .sub-toggle { display: block; font-size: 11.5px; color: var(--dim); margin-bottom: 6px; }
      .sub-toggle input { width: auto; }
      .icon-cell { display: flex; align-items: center; gap: 6px; }
      .icon-cell img { flex: 0 0 18px; width: 18px; height: 18px; opacity: 0.85; }
      .social-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 5px 16px; width: 100%; max-width: 700px; }
      .social-row { display: flex; align-items: center; gap: 8px; }
      .social-icon { flex: 0 0 18px; width: 18px; height: 18px; opacity: 0.8; }
      .social-label { flex: 0 0 84px; font-size: 12.5px; color: var(--dim); }
      .social-row input { max-width: none; flex: 1; padding: 4px 8px; font-size: 12.5px; }
      details.adv { margin-top: 10px; width: 100%; }
      details.adv summary { cursor: pointer; font-size: 12px; color: var(--dim); }
      .cipher { margin-top: 5px; font-size: 12.5px; color: var(--dim); }
      .cipher code {
        font-family: ui-monospace, monospace; background: #eef1f4; padding: 2px 6px;
        border-radius: 4px; color: var(--fg); user-select: all;
      }
      #log {
        white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12.5px;
        background: #0d1117; color: #d1d5db; border-radius: 8px; padding: 12px;
        margin: 0 0 20px; display: none;
      }
      #log.ok { display: block; border-left: 3px solid var(--ok); }
      #log.err { display: block; border-left: 3px solid #dc2626; }
      .note { color: var(--dim); font-size: 12.5px; padding: 0 0 12px; }
      .note code { background: #eef1f4; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <header>
      <h1>博客静态配置</h1>
      <span id="dirty" class="override"></span>
      <button id="reload">丢弃改动</button>
      <button id="save" class="primary">保存并写入项目文件</button>
    </header>

    <main>
      <pre id="log"></pre>
      <p class="note">
        保存后会重新生成 <code>src/theme.config.ts</code>、<code>hyacine.plugin.ts</code>，并改写
        <code>astro.config.mjs</code> 的 site 与 <code>hyacine.yml</code> 的字体/头像。
        标着「默认值 xx」的字段＝当前没覆盖主题默认；把它改回默认值就会自动取消覆盖。
      </p>
      <div id="form"></div>
    </main>

    <script>
      // ── 字段表 ────────────────────────────────────────────────
      // root: theme=主题配置(覆盖式) plugins=插件  state=其他(site/fonts/avatar)
      // type: text | textarea | number | bool | color | select | asset | email | social
      //       | list（一行一项的结构体数组）| order（固定集合排序）
      //       list 的 item 里每格 type: text | textarea | icon（带图标预览）| image（带图片候选）

      // 前端出错时直接把错误显示在页面上，避免出现"空白页"
      window.addEventListener("error", (e) => {
        const log = document.getElementById("log");
        if (!log) return;
        log.className = "err";
        log.textContent = "✗ 前端脚本出错：" + (e.message || String(e.error));
      });

      // 主题自带的真实默认值（从 src/toolkit/themeConfig.defaults.ts 抄来，用于界面显示与「是否已覆盖」判断）
      const DEFAULT_NAV = [
        { href: "/", text: "首页", icon: "i-ri-home-line" },
        { text: "关于", href: "/about/", icon: "i-ri-user-3-line" },
        { text: "文章", href: "/random/", icon: "i-ri-quill-pen-fill", dropbox: { enable: true, items: [
          { href: "/categories/", text: "分类", icon: "i-ri-book-shelf-fill" },
          { href: "/tags/", text: "标签", icon: "i-ri-price-tag-3-fill" },
          { href: "/archives/", text: "归档", icon: "i-ri-archive-line" },
        ] } },
        { text: "友链", href: "/friends/", icon: "i-ri-link" },
        { text: "动态", href: "/moments/", icon: "i-ri-chat-quote-line" },
        { text: "统计", href: "/statistics/", icon: "i-ri-bar-chart-box-line" },
      ];
      const DEFAULT_FRIENDS = [
        { url: "https://astro.build/", title: "Astro", desc: "全站体验轻快的静态站点框架，适合内容型站点与博客。", author: "Astro Team", avatar: "https://avatars.githubusercontent.com/u/44914786?s=200&v=4", color: "var(--color-orange)", siteImage: "https://astro.build/assets/press/astro-logo-dark.svg" },
        { url: "https://svelte.dev/", title: "Svelte", desc: "编译时框架，现代与简洁，组件写起来很顺手。", author: "Svelte Team", avatar: "https://avatars.githubusercontent.com/u/23617963?s=200&v=4", color: "var(--color-red)" },
        { url: "https://vite.dev/", title: "Vite", desc: "快速的前端开发构建工具，HMR 体验很棒。", author: "Vite Team", avatar: "https://avatars.githubusercontent.com/u/65625612?s=200&v=4", color: "var(--color-blue)" },
        { url: "https://bun.sh/", title: "Bun", desc: "一体化 JavaScript 运行时，速度与工具链兼备。", author: "Bun Team", avatar: "https://avatars.githubusercontent.com/u/108928776?s=200&v=4", color: "var(--color-green)", siteImage: "https://bun.sh/logo.svg" },
      ];

      // 右栏可用的卡片（顺序编辑器按这份清单显示中文名，并挑出"没被排进去"的卡片）
      const SIDEBAR_CARDS = [
        { id: "announcement", label: "公告" },
        { id: "search", label: "搜索" },
        { id: "calendar", label: "日历" },
        { id: "recentMoments", label: "最近动态" },
        { id: "randomPosts", label: "随机文章" },
        { id: "tagCloud", label: "标签云" },
      ];

      const SCHEMA = [
        { title: "站点", fields: [
          { root: "state", path: "site.url", label: "站点网址", type: "text", hint: "旧站是 https://chihomn.github.io —— 现在还是主题作者的演示域名，务必改掉" },
          { root: "state", path: "avatar", label: "头像", type: "asset", assetKey: "images", hint: "主题自带的演示头像，README 要求部署前替换" },
        ]},
        { title: "联系方式", fields: [
          { root: "state", path: "contact.email", label: "联系邮箱（明文）", type: "email",
            hint: "填明文就行。保存时会自动 ROT13 加密后写进「关于」页面，解密方法也会一并写在页面上——博客产物里不会出现明文。" },
        ]},
        { title: "页面内容", fields: [
          { root: "state", path: "content.announcement.title", label: "公告标题", type: "text",
            hint: "首屏右侧那张「公告」卡片的标题" },
          { root: "state", path: "content.announcement.body", label: "公告正文", type: "textarea", rows: 5,
            hint: "Markdown：空行分段，- 开头是列表项" },
          { root: "state", path: "content.about.title", label: "关于页标题", type: "text" },
          { root: "state", path: "content.about.description", label: "关于页描述", type: "text",
            hint: "页面 meta 与搜索结果里用的那句" },
          { root: "state", path: "content.about.date", label: "页面日期", type: "text", hint: "frontmatter 的 date，形如 2026-03-29" },
          { root: "state", path: "content.about.updated", label: "最后更新", type: "text", hint: "frontmatter 的 updated" },
          { root: "state", path: "content.about.body", label: "关于页正文", type: "textarea", rows: 12,
            hint: "Markdown；对话组件和联系方式段会自动接在正文后面，不用自己写" },
          { root: "state", path: "content.about.dialog.title", label: "对话组件标题", type: "text" },
          { root: "state", path: "content.about.dialog.intro", label: "对话组件说明", type: "text" },
          { root: "state", path: "content.about.dialog.nodes.intro", label: "对话·第一句", type: "textarea", rows: 2 },
          { root: "state", path: "content.about.dialog.nodes.identity", label: "答复·你是谁", type: "textarea", rows: 3 },
          { root: "state", path: "content.about.dialog.nodes.focus", label: "答复·关注什么", type: "textarea", rows: 3 },
          { root: "state", path: "content.about.dialog.nodes.blog", label: "答复·写什么", type: "textarea", rows: 3 },
          { root: "state", path: "content.about.dialog.nodes.stack", label: "答复·技术栈", type: "textarea", rows: 3 },
          { root: "state", path: "content.about.dialog.nodes.contact", label: "答复·怎么联系", type: "textarea", rows: 3 },
        ]},
        { title: "字体", fields: [
          { root: "state", path: "fonts.standard", label: "正文字体", type: "asset", assetKey: "fonts" },
          { root: "state", path: "fonts.monospace", label: "等宽/代码字体", type: "asset", assetKey: "fonts" },
        ]},
        { title: "品牌与信息", fields: [
          { root: "theme", path: "siteName", label: "站点名", type: "text", def: "ShokaX" },
          { root: "theme", path: "locale", label: "语言", type: "select", options: ["zh-CN", "en"], def: "zh-CN" },
          { root: "theme", path: "brand.title", label: "标题", type: "text", def: "ShokaX" },
          { root: "theme", path: "brand.subtitle", label: "副标题", type: "textarea", def: "A modern blog theme" },
          { root: "theme", path: "brand.logo", label: "Logo 字符", type: "text", def: "✨" },
        ]},
        { title: "侧边栏", fields: [
          { root: "theme", path: "sidebar.author", label: "作者", type: "text", def: "Your Name" },
          { root: "theme", path: "sidebar.description", label: "简介", type: "text", def: "A brief introduction" },
          { root: "theme", path: "sidebar.social", label: "社交链接", type: "social", def: {},
            hint: "只填链接就行，留空的不写入配置。图标由主题内置的 Remix Icon 提供，不需要你操心。" },
        ]},
        { title: "页脚", fields: [
          { root: "theme", path: "footer.since", label: "建站年份", type: "number", def: 2025 },
          { root: "theme", path: "footer.icon.name", label: "页脚图标", type: "text", def: "sakura rotate" },
          { root: "theme", path: "footer.icon.color", label: "图标颜色", type: "color", def: "var(--color-pink)", hint: "三种填法：从下拉选主题色板、用色板挑自定义颜色、或直接填 #ffc0cb / rgb() / hsl()" },
          { root: "theme", path: "footer.count", label: "显示站点统计", type: "bool", def: true },
          { root: "theme", path: "footer.powered", label: "显示驱动信息", type: "bool", def: true },
          { root: "theme", path: "footer.icp.enable", label: "显示 ICP 备案", type: "bool", def: true, hint: "默认值是主题作者的备案号，已关闭" },
          { root: "theme", path: "footer.icp.icpnumber", label: "备案号", type: "text", def: "津ICP备2022001375号" },
          { root: "theme", path: "footer.icp.icpurl", label: "备案链接", type: "text", def: "https://beian.miit.gov.cn/" },
        ]},
        { title: "标签云", fields: [
          { root: "theme", path: "tagCloud.startColor", label: "起始颜色", type: "color", def: "var(--grey-6)", hint: "已按你的旧值设为 #72cecf" },
          { root: "theme", path: "tagCloud.endColor", label: "结束颜色", type: "color", def: "var(--color-blue)", hint: "已按你的旧值设为 #ffbac3" },
        ]},
        { title: "小部件", fields: [
          { root: "theme", path: "widgets.randomPosts", label: "随机文章", type: "bool", def: true },
          { root: "theme", path: "widgets.recentComments", label: "最近评论", type: "bool", def: true },
          { root: "theme", path: "widgets.recentCommentsLimit", label: "最近评论条数", type: "number", def: 10 },
        ]},
        { title: "首页", fields: [
          { root: "theme", path: "home.pageSize", label: "每页文章数", type: "number", def: 5, hint: "旧站是 10" },
          { root: "theme", path: "home.selectedCategories", label: "首页分类筛选", type: "list", def: [{ name: "Tutorial" }, { name: "Frontend" }],
            missKey: "name",
            hint: "分类名必须与文章里的分类完全一致（大小写敏感），名字对不上首页那张卡片就是空的。全部删掉＝不显示筛选区。",
            item: [
              { key: "name", label: "分类名", type: "text", datalist: "dl_categories", ph: "从候选里挑，或自己填" },
              { key: "cover", label: "封面图（可选）", type: "image", ph: "留空用随机封面" },
            ] },
          { root: "theme", path: "home.title.behavior", label: "首页标题行为", type: "select", options: ["default", "custom"], def: "default" },
          { root: "theme", path: "home.title.customTitle", label: "自定义首页标题", type: "text", def: "" },
        ]},
        { title: "布局", fields: [
          { root: "theme", path: "layout.mode", label: "布局模式", type: "select", options: ["two-column", "three-column"], def: "three-column" },
          { root: "theme", path: "layout.rightSidebar.order", label: "右栏卡片顺序", type: "order", known: SIDEBAR_CARDS,
            hint: "用 ↑ ↓ 调顺序；每张卡显示与否由下面那几个开关控制",
            def: ["announcement", "search", "calendar", "recentMoments", "randomPosts", "tagCloud"] },
          { root: "theme", path: "layout.rightSidebar.announcement", label: "右栏·公告", type: "bool", def: true },
          { root: "theme", path: "layout.rightSidebar.search", label: "右栏·搜索", type: "bool", def: true },
          { root: "theme", path: "layout.rightSidebar.calendar", label: "右栏·日历", type: "bool", def: true },
          { root: "theme", path: "layout.rightSidebar.recentMoments", label: "右栏·最近动态", type: "bool", def: true },
          { root: "theme", path: "layout.rightSidebar.randomPosts", label: "右栏·随机文章", type: "bool", def: true },
          { root: "theme", path: "layout.rightSidebar.tagCloud", label: "右栏·标签云", type: "bool", def: true },
        ]},
        { title: "导航与页面", fields: [
          { root: "theme", path: "nav", label: "顶部导航", type: "list", def: DEFAULT_NAV,
            hint: "整体替换主题默认导航；每项都可以挂一个下拉子菜单",
            item: [
              { key: "text", label: "文字", type: "text", ph: "首页" },
              { key: "href", label: "链接", type: "text", ph: "/ 或 https://…" },
              { key: "icon", label: "图标", type: "icon", ph: "i-ri-home-line" },
            ],
            nested: { key: "dropbox", label: "展开为下拉子菜单", item: [
              { key: "text", label: "文字", type: "text" },
              { key: "href", label: "链接", type: "text" },
              { key: "icon", label: "图标", type: "icon" },
            ] } },
          { root: "theme", path: "cover.enable", label: "启用封面", type: "bool", def: true },
          { root: "theme", path: "cover.preload", label: "预加载封面", type: "bool", def: true },
          { root: "theme", path: "cover.fixedCover.enable", label: "固定封面", type: "bool", def: true },
          { root: "theme", path: "cover.fixedCover.url", label: "固定封面图", type: "text", def: "cover-4" },
          { root: "theme", path: "cover.coverUrls", label: "自定义封面列表", type: "list", kind: "str", def: [],
            hint: "旧站是调 loliapi 随机图 API，新版用本地图；一行一张，可以从候选图里挑，也可以填外链",
            item: [{ key: "__v", label: "图片", type: "image", datalist: "dl_images", ph: "images/cover-1.avif 或 https://…" }] },
          { root: "theme", path: "friends.title", label: "友链页标题", type: "text", def: "友链" },
          { root: "theme", path: "friends.description", label: "友链页说明", type: "text", def: "卡片式展示，支持站点预览与主题色点缀。" },

      /** ROT13：与生成器里保持同一套算法，用于界面实时预览密文 */
      function rot13(t) {
        return String(t ?? "").replace(/[a-zA-Z]/g, (c) => {
          const b = c <= "Z" ? 65 : 97;
          return String.fromCharCode(((c.charCodeAt(0) - b + 13) % 26) + b);
        });
      }

      // 主题内置的颜色 token（来自 src/styles 里的 CSS 变量定义）
      const COLOR_TOKENS = [
        { label: "主题色", values: ["color-aqua", "color-blue", "color-cyan-light", "color-green", "color-grey", "color-orange", "color-pink", "color-pink-light", "color-purple", "color-red", "color-yellow"] },
        { label: "灰阶", values: ["grey-0", "grey-1", "grey-2", "grey-3", "grey-4", "grey-5", "grey-6", "grey-7", "grey-8", "grey-9"] },
      ];

      /** <input type="color"> 只认 6 位 hex；把 #abc / #rrggbbaa 归一化后才能塞进去 */
      function toPickerHex(v) {
        const m = /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.exec(String(v ?? "").trim());
        if (!m) return "#ffffff";
        let t = m[1];
        if (t.length === 3) t = t.split("").map((c) => c + c).join("");
        return "#" + t.slice(0, 6);
      }

      let state = null, assets = { fonts: [], images: [] }, categories = [];

      /** 候选值：项目里的图片、文章里真实存在的分类、主题色 token */
      function datalistsHTML() {
        const img = (assets.images ?? []).map((x) => `<option value="${esc(x.rel)}">${esc(x.name)}</option>`).join("");
        const cat = (categories ?? []).map((c) => `<option value="${esc(c)}"></option>`).join("");
        const col = COLOR_TOKENS.flatMap((g) => g.values.map((n) => `<option value="var(--${n})"></option>`)).join("");
        return `<datalist id="dl_images">${img}</datalist><datalist id="dl_categories">${cat}</datalist><datalist id="dl_colors">${col}</datalist>`;
      }

      const getPath = (obj, path) => path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
      function setPath(obj, path, val) {
        const keys = path.split(".");
        let o = obj;
        for (let i = 0; i < keys.length - 1; i++) {
          if (typeof o[keys[i]] !== "object" || o[keys[i]] === null) o[keys[i]] = {};
          o = o[keys[i]];
        }
        o[keys.at(-1)] = val;
      }
      function delPath(obj, path) {
        const keys = path.split(".");
        let o = obj;
        for (let i = 0; i < keys.length - 1; i++) {
          o = o?.[keys[i]];
          if (!o) return;
        }
        delete o[keys.at(-1)];
      }

      /** 界面上该显示的「当前值」：主题字段＝你的覆盖值（没有则用默认）；插件与其他＝状态里的值 */
      function currentValue(field) {
        if (field.root === "theme") {
          const v = getPath(state.theme ?? {}, field.path);
          return v === undefined ? field.def : v;
        }
        if (field.root === "plugins") return getPath(state.plugins, field.path);
        return getPath(state, field.path);
      }

      const opts = (list, cur) =>
        list.map((v) => `<option value="${v}"${v === cur ? " selected" : ""}>${v}</option>`).join("");

      // ── 列表编辑器 ────────────────────────────────────────────
      // 以前这几处要在文本框里手写 JSON。现在统一渲染成「一行一项」，可以加/删/上下移，
      // 保存时直接从 DOM 读回来，不再经过 JSON.parse。

      const esc = (s) =>
        String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      /** 键顺序无关的相等判断：{a:1,b:2} 与 {b:2,a:1} 算同一个值 */
      function canon(v) {
        if (Array.isArray(v)) return v.map(canon);
        if (v && typeof v === "object")
          return Object.fromEntries(Object.keys(v).sort().map((k) => [k, canon(v[k])]));
        return v;
      }
      const sameJSON = (a, b) => JSON.stringify(canon(a)) === JSON.stringify(canon(b));

      /** 列表里的一格；type 决定用输入框、多行框还是带预览的图标框 */
      function cellHTML(item, value) {
        const k = esc(item.key);
        const ph = esc(item.ph ?? "");
        if (item.type === "textarea") {
          return `<label class="wide"><span>${esc(item.label)}</span><textarea data-key="${k}" placeholder="${ph}">${esc(value)}</textarea></label>`;
        }
        if (item.type === "icon") {
          const icon = String(value ?? "").trim() || "i-ri-link";
          return `<label><span>${esc(item.label)}</span><span class="icon-cell">
            <img class="icon-prev" src="/icon?name=${encodeURIComponent(icon)}" alt="" />
            <input type="text" data-key="${k}" value="${esc(value)}" placeholder="${ph || "i-ri-home-line"}" />
          </span></label>`;
        }
        const dl = item.datalist ? ` list="${esc(item.datalist)}"` : "";
        return `<label><span>${esc(item.label)}</span><input type="text" data-key="${k}" value="${esc(value)}" placeholder="${ph}"${dl} /></label>`;
      }

      /** 一行（也用作「新增一项」的模板） */
      function rowHTML(def, row) {
        const cells = def.item.map((it) => cellHTML(it, row?.[it.key])).join("");
        let nested = "";
        if (def.nested) {
          const sub = row?.[def.nested.key];
          const items = Array.isArray(sub?.items) ? sub.items : [];
          const isOn = items.length > 0 || sub?.enable === true;
          nested = `<div class="list nested${isOn ? "" : " off"}" data-nested="${esc(def.nested.key)}" data-label-key="${esc(def.nested.item[0]?.key ?? "")}">
            <label class="sub-toggle"><input type="checkbox" data-nested-enable${isOn ? " checked" : ""} /> ${esc(def.nested.label)}</label>
            <div class="list-body">${items.map((it) => rowHTML(def.nested, it)).join("")}</div>
            <div class="list-tools"><button type="button" data-list-add>＋ 加一个子项</button></div>
            <template class="list-tpl">${rowHTML(def.nested, {})}</template>
          </div>`;
        }
        return `<div class="list-row" data-row>
          <div class="list-head">
            <span class="list-index"></span>
            <span class="list-title"></span>
            <button type="button" data-list-up title="上移">↑</button>
            <button type="button" data-list-down title="下移">↓</button>
            <button type="button" data-list-del title="删除">删除</button>
          </div>
          <div class="list-fields">${cells}</div>
          ${nested}
        </div>`;
      }

      /** 一个完整的列表控件 */
      function listHTML(field, value) {
        const rows = Array.isArray(value) ? value : [];
        const labelKey = field.item[0]?.key ?? "";
        return `<div class="list" data-list data-kind="${esc(field.kind ?? "obj")}" data-label-key="${esc(labelKey)}"${field.missKey ? ` data-miss-key="${esc(field.missKey)}"` : ""}>
          <div class="list-body">${rows.map((r) => rowHTML(field, r)).join("")}</div>
          <div class="list-tools"><button type="button" data-list-add>＋ 添加一项</button>${field.missKey ? '<span class="list-note"></span>' : ""}</div>
          <template class="list-tpl">${rowHTML(field, {})}</template>
        </div>`;
      }

      /** 固定集合的排序控件（右栏卡片顺序） */
      function orderHTML(field, value) {
        const known = field.known ?? [];
        const cur = (Array.isArray(value) ? value : []).filter((x) => typeof x === "string");
        const labelOf = (id) => known.find((k) => k.id === id)?.label ?? id;
        const rows = cur
          .map(
            (id) => `<div class="order-row" data-row data-order-id="${esc(id)}">
              <span class="list-index"></span>
              <span class="name">${esc(labelOf(id))}${known.some((k) => k.id === id) ? "" : "（主题里有、这里没定义）"}</span>
              <button type="button" data-list-up title="上移">↑</button>
              <button type="button" data-list-down title="下移">↓</button>
              <button type="button" data-list-del title="删除">删除</button>
            </div>`,
          )
          .join("");
        const missing = known.filter((k) => !cur.includes(k.id));
        const adds = missing
          .map((k) => `<button type="button" data-order-add="${esc(k.id)}" data-order-label="${esc(k.label)}">＋ ${esc(k.label)}</button>`)
          .join("");
        return `<div class="list" data-list data-kind="order">
          <div class="list-body">${rows}</div>
          <div class="list-tools">${adds || '<span class="list-note">六张卡片都在里面了</span>'}</div>
        </div>`;
      }

      /** 把列表的行号、标题、子菜单显隐刷新一遍 */
      function refreshList(listEl) {
        const body = [...listEl.children].find((c) => c.classList.contains("list-body"));
        if (!body) return;
        const labelKey = listEl.dataset.labelKey;
        [...body.children].forEach((row, i) => {
          if (!row.hasAttribute?.("data-row")) return;
          const idx = row.querySelector(".list-index");
          if (idx) idx.textContent = String(i + 1);
          const title = row.querySelector(".list-title");
          if (title) {
            const ownFields = [...row.children].find((c) => c.classList?.contains("list-fields"));
            const v = labelKey ? ownFields?.querySelector(`[data-key="${labelKey}"]`)?.value : "";
            title.textContent = (v || "").trim() || "(未填)";
          }
          const nested = [...row.children].find((c) => c.classList?.contains("list"));
          const on = row.querySelector("[data-nested-enable]")?.checked;
          if (nested && nested.dataset.nested) nested.classList.toggle("off", !on);
        });
      }

      /** 分类名对不上文章里的分类时标黄——首页那张卡片会因此空掉 */
      function refreshMissWarnings() {
        const known = new Set(categories ?? []);
        document.querySelectorAll(".list[data-miss-key]").forEach((listEl) => {
          const body = [...listEl.children].find((c) => c.classList.contains("list-body"));
          let miss = 0;
          [...(body?.children ?? [])].forEach((row) => {
            const v = (row.querySelector(`.list-fields [data-key="${listEl.dataset.missKey}"]`)?.value ?? "").trim();
            const bad = v !== "" && known.size > 0 && !known.has(v);
            row.classList.toggle("miss", bad);
            if (bad) miss++;
          });
          const note = listEl.querySelector(".list-note");
          if (note) note.textContent = miss ? `有 ${miss} 个分类名在文章里找不到，首页对应卡片会是空的` : "";
        });
      }

      function refreshAllLists() {
        document.querySelectorAll(".list").forEach(refreshList);
        refreshMissWarnings();
      }

      const bodyOf = (listEl) => [...listEl.children].find((c) => c.classList.contains("list-body"));
      const templateOf = (listEl) =>
        [...listEl.querySelectorAll("template.list-tpl")].find((t) => t.closest(".list") === listEl);

      /** 从列表 DOM 里把值读回来（不经过 JSON） */
      function collectList(listEl) {
        const kind = listEl.dataset.kind ?? "obj";
        const out = [];
        for (const row of [...(bodyOf(listEl)?.children ?? [])]) {
          if (!row.hasAttribute("data-row")) continue;
          if (kind === "order") {
            out.push(row.dataset.orderId);
            continue;
          }
          const obj = {};
          // 只取本行自己的字段：必须用「直接子元素里的 .list-fields」，
          // 否则 querySelectorAll 会连子菜单里的输入框一起抓，父项会被子项的值覆盖
          const ownFields = [...row.children].find((c) => c.classList?.contains("list-fields"));
          ownFields?.querySelectorAll("[data-key]").forEach((el) => {
            const v = String(el.value ?? "").trim();
            if (v !== "") obj[el.dataset.key] = v;
          });
          const nested = [...row.children].find((c) => c.classList?.contains("list") && c.dataset.nested);
          if (nested) {
            const on = row.querySelector("[data-nested-enable]")?.checked ?? false;
            const items = collectList(nested);
            if (on && items.length) obj[nested.dataset.nested] = { enable: true, items };
          }
          if (kind === "str") {
            if (obj.__v) out.push(obj.__v);
          } else if (Object.keys(obj).length) out.push(obj);
        }
        return out;
      }

      /** 用所选字体文件渲染预览（@font-face 指向 /asset 路由） */
      function applyFontPreview(sel) {
        const box = document.querySelector(`.font-preview[data-for="${sel.id}"]`);
        if (!box || !sel.value) return;
        const fam = "prev_" + sel.id;
        if (!document.getElementById("ff_" + fam)) {
          const st = document.createElement("style");
          st.id = "ff_" + fam;
          st.textContent = `@font-face{font-family:${fam};src:url("/asset?rel=${encodeURIComponent(sel.value)}");font-display:swap}`;
          document.head.appendChild(st);
        }
        box.style.fontFamily = `${fam}, sans-serif`;
        box.style.fontSize = "18px";
      }

      function render() {
        const form = document.getElementById("form");
        form.innerHTML = SCHEMA.map((sec, si) => {
          const rows = sec.fields.map((f, fi) => {
            const val = currentValue(f);
            const id = `f_${si}_${fi}`;
            // data-def 存的是「主题默认值」，点「恢复默认」时把控件还原成它
            const d = esc(JSON.stringify(f.def ?? null));
            const isDefault = sameJSON(val, f.def);
            let ctrl = "";
            if (f.type === "bool") {
              ctrl = `<input type="checkbox" id="${id}" ${val ? "checked" : ""} />`;
            } else if (f.type === "number") {
              ctrl = `<input type="number" id="${id}" value="${val ?? ""}" />`;
            } else if (f.type === "select") {
              ctrl = `<select id="${id}">${opts(f.options, val)}</select>`;
            } else if (f.type === "textarea") {
              ctrl = `<textarea id="${id}"${f.rows ? ` rows="${Number(f.rows)}"` : ""}>${val ?? ""}</textarea>`;
            } else if (f.type === "social") {
              const cur = val && typeof val === "object" ? val : {};
              const known = new Set(SOCIAL_PLATFORMS.map((x) => x.key));
              const extraItems = Object.entries(cur)
                .filter(([k]) => !known.has(k))
                .map(([k, v2]) => ({ key: k, icon: v2?.icon ?? "", url: v2?.url ?? "" }));
              const rows = SOCIAL_PLATFORMS.map((pf) => {
                const u = String(cur[pf.key]?.url ?? "").replace(/"/g, "&quot;");
                return `<div class="social-row">
                  <img class="social-icon" src="/icon?name=${encodeURIComponent(pf.icon)}" alt="" />
                  <span class="social-label">${pf.label}</span>
                  <input type="text" class="social-url" data-key="${pf.key}" data-icon="${pf.icon}" placeholder="${pf.ph ?? ""}" value="${u}" />
                </div>`;
              }).join("");
              ctrl = `<div class="social-list">${rows}</div>
                <div class="social-extra">${listHTML({ item: [
                  { key: "key", label: "平台键名", type: "text", ph: "pixiv" },
                  { key: "icon", label: "图标", type: "icon", ph: "i-ri-pixiv-fill" },
                  { key: "url", label: "链接", type: "text", ph: "https://…" },
                ] }, extraItems)}</div>
                <span class="hint">上面 25 个平台不够用时在这里自己加：键名随你取，图标填 Remix Icon 名（如 i-ri-pixiv-fill）。</span>`;
            } else if (f.type === "email") {
              const shown = rot13(val ?? "");
              ctrl = `<input type="text" id="${id}" placeholder="you@example.com" value="${(val ?? "").replace(/"/g, "&quot;")}" />
                <div class="cipher">博客上会显示（ROT13 密文）：<code id="${id}_c">${shown || "（未填写）"}</code></div>`;
            } else if (f.type === "list") {
              ctrl = listHTML(f, val);
            } else if (f.type === "order") {
              ctrl = orderHTML(f, val);
            } else if (f.type === "color") {
              const cur = String(val ?? "").trim();
              const groups = COLOR_TOKENS.map(
                (g) =>
                  `<optgroup label="${g.label}">${g.values
                    .map((n) => {
                      const v = `var(--${n})`;
                      return `<option value="${v}"${cur === v ? " selected" : ""}>${v}</option>`;
                    })
                    .join("")}</optgroup>`,
              ).join("");
              ctrl = `<input type="color" id="${id}_p" value="${toPickerHex(cur)}" />
                <select id="${id}_t" style="max-width:186px">
                  <option value="__custom__"${cur && !cur.startsWith("var(--") ? " selected" : ""}>自定义颜色…</option>
                  ${groups}
                </select>
                <input type="text" id="${id}" value="${cur.replace(/"/g, "&quot;")}" style="max-width:186px" />`;
            } else if (f.type === "asset" && f.assetKey === "images") {
              const cur = (val ?? "").replace(/^src\/assets\//, "");
              const imgs = assets.images || [];
              // 当前值不在候选目录里时，也要显示出来，否则界面上会"什么都没选中"
              const shown =
                !cur || imgs.some((x) => x.rel === cur)
                  ? imgs
                  : [{ name: `${cur}（未在目录中找到）`, rel: cur }, ...imgs];
              ctrl = `<div class="thumbs">${shown
                .map(
                  (x) => `<label class="thumb${x.rel === cur ? " on" : ""}" title="${x.rel}">
                  <input type="radio" name="${id}" value="${x.rel}"${x.rel === cur ? " checked" : ""} />
                  <img src="/asset?rel=${encodeURIComponent(x.rel)}" alt="${x.name}" loading="lazy" />
                  <span>${x.name}</span>
                </label>`,
                )
                .join("")}</div>`;
            } else if (f.type === "asset") {
              const list = assets[f.assetKey] || [];
              const cur = (val ?? "").replace(/^src\/assets\//, "");
              const has = list.some((x) => x.rel === cur);
              ctrl = `<select id="${id}">${has ? "" : `<option value="${cur}" selected>${cur}（当前，未在目录中找到）</option>`}${
                list.map((x) => `<option value="${x.rel}"${x.rel === cur ? " selected" : ""}>${x.rel}</option>`).join("")
              }</select><div class="font-preview" data-for="${id}">中文示例 ABCabc 123 —— 这段话会用所选字体渲染</div>`;
            } else {
              ctrl = `<input type="text" id="${id}" value="${(val ?? "").replace(/"/g, "&quot;")}" />`;
            }
            const badge = f.root === "theme" && !isDefault ? '<span class="override">已覆盖</span>' : "";
            const reset = f.root === "theme" ? `<button class="btn-reset" data-del="${f.path}">恢复默认</button>` : "";
            return `<div class="field">
              <label for="${id}">${f.label}
                <span class="path">${f.root === "theme" ? "" : f.root + "."}${f.path}</span>
                ${f.hint ? `<span class="hint">${f.hint}</span>` : ""}
              </label>
              <div class="ctrl" data-root="${f.root}" data-path="${f.path}" data-type="${f.type}" data-def="${d}" data-id="${id}">
                ${ctrl}${badge}${reset}
              </div>
            </div>`;
          }).join("");
          return `<section><h2>${sec.title}</h2>${rows}</section>`;
        }).join("") + datalistsHTML();

        refreshAllLists();
        // 字体字段：渲染预览并跟随选择实时更新
        form.querySelectorAll("select[id]").forEach((sel) => {
          if (!form.querySelector(`.font-preview[data-for="${sel.id}"]`)) return;
          applyFontPreview(sel);
          sel.addEventListener("change", () => applyFontPreview(sel));
        });
        // 图片卡片：点选时高亮
        form.querySelectorAll('input[type="radio"]').forEach((r) =>
          r.addEventListener("change", () => {
            const box = r.closest(".thumbs");
            box?.querySelectorAll(".thumb").forEach((t) => t.classList.remove("on"));
            r.closest(".thumb")?.classList.add("on");
          }),
        );
        // 颜色字段：色板 / token 下拉 / 文本框 三者联动（文本框是最终写入的值）
        form.querySelectorAll('.ctrl[data-type="color"]').forEach((wrap) => {
          const pick = wrap.querySelector('input[type="color"]');
          const sel = wrap.querySelector("select");
          const txt = wrap.querySelector('input[type="text"]');
          if (!pick || !sel || !txt) return;
          const syncFromText = () => {
            const v = txt.value.trim();
            pick.value = toPickerHex(v);
            sel.value = [...sel.options].some((o) => o.value === v) ? v : "__custom__";
          };
          pick.addEventListener("input", () => {
            txt.value = pick.value;
            sel.value = "__custom__";
            markDirty();
          });
          sel.addEventListener("change", () => {
            if (sel.value === "__custom__") {
              pick.focus();
              return;
            }
            txt.value = sel.value;
            pick.value = toPickerHex(sel.value);
            markDirty();
          });
          txt.addEventListener("input", syncFromText);
          syncFromText();
        });
        // 联系邮箱：输入时实时显示加密后会写进博客的密文
        form.querySelectorAll('.ctrl[data-type="email"] input').forEach((inp) => {
          const upd = () => {
            const box = form.querySelector(`#${inp.id}_c`);
            if (box) box.textContent = rot13(inp.value) || "（未填写）";
          };
          inp.addEventListener("input", upd);
          upd();
        });
      }

      // ── 表单事件：一次性挂在 form 上，控件重建也不用重新绑定 ──
      function addListRow(listEl) {
        const tpl = templateOf(listEl);
        const body = bodyOf(listEl);
        if (!tpl || !body) return;
        body.appendChild(tpl.content.firstElementChild.cloneNode(true));
        refreshList(listEl);
      }

      function findField(root, path) {
        for (const sec of SCHEMA) for (const f of sec.fields) if (f.root === root && f.path === path) return f;
        return null;
      }

      const orderRowHTML = (id, label) => `<div class="order-row" data-row data-order-id="${esc(id)}">
          <span class="list-index"></span>
          <span class="name">${esc(label)}</span>
          <button type="button" data-list-up title="上移">↑</button>
          <button type="button" data-list-down title="下移">↓</button>
          <button type="button" data-list-del title="删除">删除</button>
        </div>`;

      const formEl = document.getElementById("form");

      formEl.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        const row = btn.closest("[data-row]");
        const listEl = btn.closest(".list");
        const wrap = btn.closest(".ctrl");

        // 恢复默认：删掉这处覆盖，并把控件还原成主题默认值
        if (btn.dataset.del !== undefined && wrap) {
          const f = findField(wrap.dataset.root, wrap.dataset.path);
          const def = f?.def ?? null;
          if (wrap.dataset.root === "theme") delPath(state.theme, wrap.dataset.path);
          if (f && (f.type === "list" || f.type === "order")) {
            const old = wrap.querySelector(".list");
            if (old) {
              old.insertAdjacentHTML("beforebegin", f.type === "list" ? listHTML(f, def) : orderHTML(f, def));
              old.remove();
            }
          } else {
            const input = document.getElementById(wrap.dataset.id);
            if (input) {
              if (f?.type === "bool") input.checked = !!def;
              else input.value = def ?? "";
            }
          }
          refreshAllLists();
          markDirty();
          return;
        }
        if (btn.dataset.orderAdd !== undefined && listEl) {
          bodyOf(listEl)?.insertAdjacentHTML("beforeend", orderRowHTML(btn.dataset.orderAdd, btn.dataset.orderLabel));
          btn.remove();
          refreshAllLists();
          markDirty();
          return;
        }
        if (btn.dataset.listAdd !== undefined && listEl) {
          addListRow(listEl);
          markDirty();
          return;
        }
        if (btn.dataset.listDel !== undefined && row) {
          row.remove();
          refreshAllLists();
          markDirty();
          return;
        }
        if (btn.dataset.listUp !== undefined && row) {
          const prev = row.previousElementSibling;
          if (prev?.hasAttribute("data-row")) row.parentElement.insertBefore(row, prev);
          refreshAllLists();
          markDirty();
          return;
        }
        if (btn.dataset.listDown !== undefined && row) {
          const next = row.nextElementSibling;
          if (next?.hasAttribute("data-row")) row.parentElement.insertBefore(next, row);
          refreshAllLists();
          markDirty();
        }
      });

      formEl.addEventListener("input", (e) => {
        const el = e.target;
        if (el.dataset?.key === "icon") {
          const img = el.closest(".icon-cell")?.querySelector(".icon-prev");
          if (img) img.src = "/icon?name=" + encodeURIComponent(el.value.trim() || "i-ri-link");
        }
        if (el.closest(".list")) refreshAllLists();
        markDirty();
      });
      formEl.addEventListener("change", (e) => {
        if (e.target.matches("[data-nested-enable]")) refreshAllLists();
        markDirty();
      });

      const markDirty = () => (document.getElementById("dirty").textContent = "有未保存的改动");

      /** 从界面收集值，重建 state */
      function collect() {
        const nextTheme = {};
        for (const sec of SCHEMA) {
          for (const f of sec.fields) {
            const wrap = document.querySelector(`.ctrl[data-path="${f.path}"][data-root="${f.root}"]`);
            if (!wrap) continue;
            const input = document.getElementById(wrap.dataset.id);
            let v;
            if (f.type === "bool") v = input.checked;
            else if (f.type === "number") v = input.value === "" ? null : Number(input.value);
            else if (f.type === "list" || f.type === "order") {
              const listEl = wrap.querySelector(".list");
              v = listEl ? collectList(listEl) : [];
            } else if (f.type === "social") {
              const out = {};
              wrap.querySelectorAll(".social-row").forEach((row) => {
                const inp = row.querySelector(".social-url");
                const u = inp.value.trim();
                if (u) out[inp.dataset.key] = { url: u, icon: inp.dataset.icon };
              });
              const extraList = wrap.querySelector(".social-extra .list");
              if (extraList) {
                for (const it of collectList(extraList)) {
                  const k = String(it.key ?? "").trim();
                  if (k && it.url) out[k] = { url: it.url, icon: it.icon || "i-ri-link" };
                }
              }
              v = out;
            } else if (f.type === "asset") {
              const radio = wrap.querySelector('input[type="radio"]:checked');
              const sel = wrap.querySelector("select");
              v = radio ? radio.value : sel ? sel.value : "";
            } else v = input.value;

            if (f.root === "theme") {
              if (!sameJSON(v, f.def)) setPath(nextTheme, f.path, v);
            } else if (f.root === "plugins") {
              setPath(state.plugins, f.path, v);
            } else {
              setPath(state, f.path, v);
            }
          }
        }
        state.theme = nextTheme;
        return state;
      }

      async function load() {
        const r = await fetch("/api/state");
        const d = await r.json();
        state = d.state;
        assets = d.assets;
        categories = d.categories ?? [];
        render();
        document.getElementById("dirty").textContent = "";
      }

      document.getElementById("save").addEventListener("click", async () => {
        const log = document.getElementById("log");
        let payload;
        try { payload = collect(); }
        catch (e) { log.className = "err"; log.textContent = "✗ " + e.message; return; }
        log.className = ""; log.textContent = "正在写入…";
        const r = await fetch("/api/save", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
        const d = await r.json();
        log.className = d.ok ? "ok" : "err";
        log.textContent = (d.ok ? "✓ " : "✗ ") + d.log;
        if (d.ok) { document.getElementById("dirty").textContent = ""; await load(); }
      });

      document.getElementById("reload").addEventListener("click", load);
      load();
    </script>
  </body>
</html>
